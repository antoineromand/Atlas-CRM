spring.application.name=atlascrm
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atlascrm}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
atlascrm.security.jwt.secret=${JWT_SECRET:YXRsYXMtY3JtLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==}
atlascrm.security.jwt.access-expiration=${EXPIRATION_ACCESS_TOKEN:15m}
atlascrm.security.jwt.refresh-expiration=${EXPIRATION_REFRESH_TOKEN:7d}
server.port=${SERVER_PORT:3000}
