@if (menuOpen()) {
  <button class="dashboard-backdrop" type="button" aria-label="Close menu" (click)="closeMenu()"></button>
}

@if (profileMenuOpen()) {
  <button
    class="dashboard-profile-backdrop"
    type="button"
    aria-label="Close profile menu"
    (click)="closeProfileMenu()"
  ></button>
}

<aside class="dashboard-sidebar" [class.dashboard-sidebar--open]="menuOpen()">
  <div class="dashboard-sidebar__brand">
    <app-brand-mark />
    <div>
      <h1 class="dashboard-sidebar__title">Atlas CRM</h1>
      <p class="dashboard-sidebar__subtitle">Independent Professional</p>
    </div>

    <button class="dashboard-sidebar__close" type="button" aria-label="Close menu" (click)="closeMenu()">
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </div>

  <nav class="dashboard-sidebar__nav" aria-label="Dashboard navigation">
    @for (item of sidebarItems; track item.label) {
        @if (!item.disabled && item.route) {
          <a
            class="dashboard-sidebar__link"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="closeMenu()"
          >
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <button class="dashboard-sidebar__link" type="button" disabled>
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </button>
      }
    }
  </nav>

  <div class="dashboard-sidebar__footer">
    <button class="dashboard-sidebar__new-mission" type="button" (click)="openMissionCreator()">
      <span class="material-symbols-outlined" aria-hidden="true">add</span>
      <span>New Mission</span>
    </button>
  </div>
</aside>

<header class="dashboard-topbar">
  <button class="dashboard-topbar__menu-button" type="button" aria-label="Open menu" (click)="toggleMenu()">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>

  <div class="dashboard-topbar__search">
    <span class="material-symbols-outlined" aria-hidden="true">search</span>
    <input
      type="search"
      placeholder="Search missions, roles, or tags..."
      aria-label="Search missions, roles, or tags"
    />
  </div>

  <div class="dashboard-topbar__actions">
    <button class="dashboard-topbar__icon-button" type="button" aria-label="Notifications">
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
      <span class="dashboard-topbar__notification-dot" aria-hidden="true"></span>
    </button>

    <div class="dashboard-profile">
      <button
        class="dashboard-topbar__avatar-button"
        type="button"
        aria-label="User profile"
        aria-haspopup="menu"
        [attr.aria-expanded]="profileMenuOpen()"
        (click)="toggleProfileMenu()"
      >
        <img
          alt="User avatar"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2X0ZLWb5Kh-MINZY5y-j99VehsaN50JY07O0MI614H6ZBaW_ON3YuDYt4X7oMQa5GAwYKvbRZ-8UVfC2eZOn5yBtZJ6wVlAJSH30PXYlRmE7HyBi_RYrLm9Wv6bLVW1yfwzN433UIR3N55iss_61h1hNgZG412NfFDPKupiesqhCHZoZoIc47JRTglr82PvI4y-xXTOX019Fqyrd6o9feavvQWcVbO1qnsz6qxR4xzJc6jdiSa-1EF8YxJTSDLoAtA5XrNEFTWmY"
        />
      </button>

      @if (profileMenuOpen()) {
        <div class="dashboard-profile__menu" role="menu" aria-label="Profile actions">
          <a class="dashboard-profile__item" [routerLink]="['/dashboard/settings']" (click)="closeProfileMenu()">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            <span>Settings</span>
          </a>

          <button class="dashboard-profile__item dashboard-profile__item--danger" type="button" (click)="logout()">
            <span class="material-symbols-outlined" aria-hidden="true">logout</span>
            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>

<main class="dashboard-content">
  <router-outlet />
</main>
