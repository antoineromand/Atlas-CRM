<div class="settings-page">
  <section class="settings-page__hero surface-card">
    <div class="settings-page__hero-copy">
      <p class="eyebrow">Settings</p>
      <h1 class="display-title">Account settings</h1>
      <p class="section-copy">
        A first pass at the account settings page backed by `GET /api/v1/account/me` and
        `PATCH /api/v1/account/me`.
      </p>
    </div>

    <div class="settings-page__hero-actions">
      <span class="pill">Profile + billing</span>
      <button
        class="btn btn--primary"
        type="button"
        (click)="onSubmit()"
        [disabled]="isLoading() || isSaving() || settingsForm.invalid || settingsForm.pristine"
      >
        {{ isSaving() ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
  </section>

  @if (loadError()) {
    <section class="settings-page__error surface-card">
      <div>
        <p class="eyebrow">Load error</p>
        <h2>Could not load account details</h2>
        <p class="section-copy">{{ loadError() }}</p>
      </div>

      <button class="btn btn--secondary" type="button" (click)="reload()">Retry</button>
    </section>
  }

  <div class="settings-page__grid">
    <app-settings-summary-card [account]="account()" [loading]="isLoading()" />
    <app-settings-account-form
      [form]="settingsForm"
      [loading]="isLoading()"
      [saving]="isSaving()"
      (submitted)="onSubmit()"
    />
  </div>
</div>
