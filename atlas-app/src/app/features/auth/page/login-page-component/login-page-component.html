<main class="login-page">
  <section class="login-page__layout">
    <div class="login-page__copy">
      <a class="login-page__brand" routerLink="/">
        <app-brand-mark />
        <span class="login-page__brand-name">Atlas CRM</span>
      </a>

      <p class="eyebrow">Sign in</p>
      <h1 class="display-title login-page__title">Return to your Atlas CRM workspace.</h1>
      <p class="section-copy login-page__description">
        The live product is not wired yet. This route already exists so the journey stays clear from the landing page.
      </p>

      <div class="login-page__actions">
        <a class="btn btn--primary" routerLink="/">Back to home</a>
        <a class="btn btn--secondary" routerLink="/">Explore the landing</a>
      </div>
    </div>

    <div class="login-page__visual">
      <app-screen-card
        imageSrc="/atlas/screens/login/screen.png"
        imageAlt="Atlas CRM sign-in screen screenshot"
        title="Atlas CRM sign-in"
        description="The Stitch reference design for the authentication page."
        frameLabel="Login" />
    </div>
  </section>
</main>
