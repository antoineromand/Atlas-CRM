version: "3.9"

services:
  atlas-crm-db:
    image: postgres:16.2-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_DEV}:5432"

volumes:
  data:

